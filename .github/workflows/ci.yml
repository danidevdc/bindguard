name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder-api-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-bindguard-ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-bindguard-ci
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-bindguard-ci.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "100000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:100000000000:web:0000000000000000000000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
